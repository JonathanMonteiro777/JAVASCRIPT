<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 04 JavaScript</title>

    <style>
        /* comentario em css */
        body {
            background-color: rgb(0, 0, 0);
            color: white;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <!-- comentario em html -->
    <h1>Olá mundo!</h1>

    <p>Curso de javascript </p>

    <script>
       var n1 = Number(window.prompt("Digite um numero: "))
       var n2 = Number(window.prompt("Digite outro numero: "))

       var soma = n1 + n2

       window.alert("A soma do valores é " + soma)
        

    </script>
</body>
